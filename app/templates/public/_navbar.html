{% set logo = settings.get('logo', '') %}
<nav class="navbar"
     x-data="{ mobileOpen: false, scrolled: false }"
     x-init="scrolled = window.scrollY > 12"
     @scroll.window.passive="scrolled = window.scrollY > 12"
     :class="scrolled || mobileOpen ? 'bg-milk/80 backdrop-blur-xl shadow-[0_1px_0_rgba(46,10,31,0.06)]' : 'bg-transparent'">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between transition-all duration-500 ease-silk" :class="scrolled ? 'h-16' : 'h-20'">
            <a href="{{ url_for('catalog.home') }}" class="flex items-center gap-3 group" aria-label="{{ store_name }}, inicio">
                <span class="relative w-10 h-10 rounded-full overflow-hidden ring-1 ring-brand-100 bg-white flex items-center justify-center transition-transform duration-500 ease-silk group-hover:rotate-[-8deg] group-hover:scale-105">
                    {% if logo %}
                    <img src="{{ url_for('static', filename='images/logo/' + logo) }}" alt="" class="w-full h-full object-cover">
                    {% else %}
                    <img src="{{ url_for('static', filename='favicon.png') }}" alt="" class="w-7 h-7 object-contain">
                    {% endif %}
                </span>
                <span class="font-display text-xl font-semibold tracking-tight text-ink-900">{{ store_name }}</span>
            </a>

            <div class="hidden md:flex items-center gap-8 text-[15px] font-medium text-ink-700">
                <a href="{{ url_for('catalog.home') }}" class="link-line py-1 hover:text-ink-900 {% if request.endpoint == 'catalog.home' %}text-ink-900 !bg-[length:100%_1px]{% endif %}">Inicio</a>
                <a href="{{ url_for('catalog.catalog') }}" class="link-line py-1 hover:text-ink-900 {% if request.endpoint == 'catalog.catalog' %}text-ink-900 !bg-[length:100%_1px]{% endif %}">Catálogo</a>
                {% for cat in categories[:3] %}
                <a href="{{ url_for('catalog.catalog', category=cat.id) }}" class="link-line py-1 hover:text-ink-900">{{ cat.name }}</a>
                {% endfor %}
            </div>

            <div class="flex items-center gap-1">
                <a href="{{ url_for('catalog.catalog') }}" class="btn-icon" aria-label="Buscar productos">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </a>
                <button @click="$store.cart.open = true"
                        class="btn-icon relative"
                        :class="$store.cart.bump && 'animate-[bag-bump_.6s_cubic-bezier(.22,1,.36,1)]'"
                        aria-label="Abrir mi bolsa">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span x-show="$store.cart.count > 0" x-cloak x-text="$store.cart.count"
                          class="absolute top-0.5 right-0.5 min-w-[18px] h-[18px] px-1 bg-brand-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-milk"></span>
                </button>
                <button @click="mobileOpen = !mobileOpen" class="md:hidden btn-icon" :aria-expanded="mobileOpen" aria-label="Menú">
                    <i x-show="!mobileOpen" data-lucide="menu" class="w-5 h-5"></i>
                    <i x-show="mobileOpen" x-cloak data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div x-show="mobileOpen" x-cloak
             x-transition:enter="transition ease-silk duration-400" x-transition:enter-start="opacity-0 -translate-y-3" x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             class="md:hidden pb-6 pt-2">
            <div class="flex flex-col font-display text-3xl font-medium text-ink-900">
                <a href="{{ url_for('catalog.home') }}" class="py-2.5 border-b border-ink-100">Inicio</a>
                <a href="{{ url_for('catalog.catalog') }}" class="py-2.5 border-b border-ink-100">Catálogo</a>
                {% for cat in categories[:5] %}
                <a href="{{ url_for('catalog.catalog', category=cat.id) }}" class="py-2.5 border-b border-ink-100 text-ink-600">{{ cat.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
