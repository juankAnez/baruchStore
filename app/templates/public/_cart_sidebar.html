<div x-data x-show="$store.cart.open" x-cloak class="fixed inset-0 z-[70]" @keydown.escape.window="$store.cart.open = false">
  <div class="absolute inset-0 bg-ink-950/40 backdrop-blur-[6px]"
       x-show="$store.cart.open"
       x-transition:enter="transition ease-silk duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       @click="$store.cart.open = false"></div>

  <aside class="absolute right-0 top-0 h-full w-full max-w-md bg-milk shadow-float flex flex-col sm:rounded-l-5xl overflow-hidden"
         x-show="$store.cart.open"
         x-transition:enter="transition ease-silk duration-500 transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-250 transform" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
         role="dialog" aria-modal="true" aria-label="Mi bolsa">

    <header class="flex items-center justify-between px-6 sm:px-8 pt-7 pb-5">
      <h2 class="font-display text-3xl font-medium">
        Mi bolsa
        <span x-show="$store.cart.count > 0" x-text="'(' + $store.cart.count + ')'" class="text-ink-400 font-light"></span>
      </h2>
      <button @click="$store.cart.open = false" class="w-11 h-11 rounded-full bg-white ring-1 ring-ink-100 flex items-center justify-center hover:rotate-90 transition-transform duration-500 ease-silk" aria-label="Cerrar">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Vacía -->
    <div class="flex-1 flex flex-col items-center justify-center px-8 text-center" x-show="$store.cart.items.length === 0">
      <svg class="w-10 h-10 text-brand-300 animate-twinkle" aria-hidden="true"><use href="#sparkle"/></svg>
      <p class="mt-5 font-display text-2xl font-medium">Tu bolsa está vacía</p>
      <p class="mt-2 text-ink-500">Agrega productos desde el catálogo y aquí armamos tu pedido.</p>
      <a href="{{ url_for('catalog.catalog') }}" class="btn-primary mt-7">Ir al catálogo</a>
    </div>

    <!-- Con productos -->
    <div class="flex-1 overflow-y-auto scrollbar-thin px-6 sm:px-8" x-show="$store.cart.items.length > 0">
      <ul class="divide-y divide-ink-100">
        <template x-for="(item, index) in $store.cart.items" :key="item.id">
          <li class="flex gap-4 py-4"
              x-transition:enter="transition ease-silk duration-500" x-transition:enter-start="opacity-0 translate-x-4" x-transition:enter-end="opacity-100 translate-x-0">
            <div class="w-20 h-24 rounded-2xl bg-gradient-to-b from-white to-blush ring-1 ring-ink-100 overflow-hidden shrink-0">
              <template x-if="item.image">
                <img :src="'/static/images/productos/' + item.image" :alt="item.name" class="w-full h-full object-cover">
              </template>
            </div>
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-start justify-between gap-3">
                <p class="font-medium leading-snug line-clamp-2" x-text="item.name"></p>
                <button @click="$store.cart.removeItem(index)" class="text-ink-300 hover:text-brand-700 transition-colors -mt-0.5" :aria-label="'Quitar ' + item.name">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="mt-auto flex items-center justify-between">
                <div class="flex items-center rounded-full bg-white ring-1 ring-ink-100">
                  <button @click="$store.cart.decreaseQuantity(index)" class="w-9 h-9 flex items-center justify-center text-ink-500 hover:text-ink-900" aria-label="Quitar uno"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                  <span class="w-6 text-center text-sm font-semibold" x-text="item.quantity"></span>
                  <button @click="$store.cart.increaseQuantity(index)" class="w-9 h-9 flex items-center justify-center text-ink-500 hover:text-ink-900" aria-label="Agregar uno"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                </div>
                <span class="font-semibold" x-text="$store.cart.money(item.price * item.quantity)"></span>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <!-- Datos de entrega -->
      <section class="mt-4 mb-6 rounded-4xl bg-white ring-1 ring-ink-100 p-5 space-y-3">
        <h3 class="font-semibold">Datos de entrega</h3>
        <label class="block">
          <span class="text-sm text-ink-500">Nombre completo</span>
          <input type="text" autocomplete="name" x-model="$store.cart.shippingForm.name" class="input mt-1 bg-milk border-transparent">
        </label>
        <label class="block">
          <span class="text-sm text-ink-500">Dirección de entrega</span>
          <input type="text" autocomplete="street-address" x-model="$store.cart.shippingForm.address" placeholder="Calle, número, barrio, ciudad" class="input mt-1 bg-milk border-transparent">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <span class="text-sm text-ink-500">Teléfono</span>
            <input type="tel" autocomplete="tel" x-model="$store.cart.shippingForm.phone" class="input mt-1 bg-milk border-transparent">
          </label>
          <label class="block">
            <span class="text-sm text-ink-500">Forma de pago</span>
            <select x-model="$store.cart.shippingForm.payment" class="input mt-1 bg-milk border-transparent">
              <option value="Efectivo">Efectivo</option>
              <option value="Transferencia">Transferencia</option>
              <option value="Tarjeta">Tarjeta</option>
            </select>
          </label>
        </div>
      </section>
    </div>

    <footer class="px-6 sm:px-8 py-6 bg-white border-t border-ink-100 space-y-4" x-show="$store.cart.items.length > 0">
      <div class="flex items-baseline justify-between">
        <span class="text-ink-500">Total</span>
        <span class="font-display text-3xl font-medium" x-text="$store.cart.money($store.cart.total)"></span>
      </div>
      <button @click="$store.cart.checkoutWhatsApp()" class="btn-whatsapp btn-shine w-full py-4 text-base">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
        Enviar pedido por WhatsApp
      </button>
      <button @click="$store.cart.clearCart()" class="w-full text-sm text-ink-400 hover:text-brand-700 transition-colors">Vaciar la bolsa</button>
    </footer>
  </aside>
</div>
