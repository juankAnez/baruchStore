<header class="h-20 shrink-0 flex items-center justify-between gap-4 px-4 sm:px-6 lg:px-10 bg-milk/80 backdrop-blur-xl border-b border-ink-100/70">
    <div class="flex items-center gap-3 min-w-0">
        <button @click="mobileNav = true" class="lg:hidden btn-icon" aria-label="Abrir menú">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <button @click="collapsed = !collapsed" class="hidden lg:flex btn-icon" :aria-label="collapsed ? 'Expandir menú' : 'Contraer menú'">
            <i data-lucide="panel-left" class="w-5 h-5"></i>
        </button>
        <h1 class="font-display text-2xl sm:text-3xl font-medium tracking-tight truncate">{% block page_title %}Resumen{% endblock %}</h1>
    </div>
    <div class="flex items-center gap-2 shrink-0">
        {% block page_actions %}{% endblock %}
        <span class="hidden sm:flex items-center gap-2.5 pl-3 ml-1 border-l border-ink-100">
            <span class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-400 to-brand-700 text-white flex items-center justify-center text-sm font-semibold">{{ current_user.username[:1]|upper }}</span>
            <span class="text-sm font-medium text-ink-700">{{ current_user.username }}</span>
        </span>
    </div>
</header>
