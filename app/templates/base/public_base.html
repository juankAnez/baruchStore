<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}{{ store_name }} — maquillaje y cuidado de la piel. Arma tu pedido y lo confirmamos por WhatsApp.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ store_name }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Maquillaje y cuidado de la piel elegidos uno a uno.{% endblock %}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#e0006a">
    <title>{% block title %}{{ store_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script src="https://unpkg.com/lucide@0.453.0"></script>
    <script>
        window.BARUCH_CONFIG = {
            whatsapp: {{ (settings.get("whatsapp") or "")|tojson }},
            whatsapp_message: {{ (settings.get("whatsapp_message") or "¡Hola! Quiero hacer un pedido:")|tojson }},
            business_name: {{ store_name|tojson }},
        };
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-milk text-ink-900 overflow-x-hidden">
    {# Destello de 4 puntas del logo, reutilizable con <use href="#sparkle"> #}
    <svg width="0" height="0" class="absolute" aria-hidden="true">
        <symbol id="sparkle" viewBox="0 0 24 24"><path d="M12 0c.6 5.6 2.4 8.9 6.2 10.6L24 12l-5.8 1.4C14.4 15.1 12.6 18.4 12 24c-.6-5.6-2.4-8.9-6.2-10.6L0 12l5.8-1.4C9.6 8.9 11.4 5.6 12 0z" fill="currentColor"/></symbol>
    </svg>

    {% block body %}{% endblock %}

    <!-- Panel de detalle de producto -->
    <div x-data x-show="$store.productDetailModal.open" x-cloak class="fixed inset-0 z-[60] flex justify-end" @keydown.escape.window="$store.productDetailModal.close()">
        <div class="absolute inset-0 bg-ink-950/40 backdrop-blur-[6px]"
             x-show="$store.productDetailModal.open"
             x-transition:enter="transition ease-silk duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             @click="$store.productDetailModal.close()"></div>
        <div class="relative w-full max-w-xl h-full bg-milk shadow-float flex flex-col overflow-y-auto scrollbar-thin sm:rounded-l-5xl"
             x-show="$store.productDetailModal.open"
             x-transition:enter="transition ease-silk duration-500 transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-250 transform" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
             role="dialog" aria-modal="true" aria-label="Detalle del producto"
             id="product-detail-modal-content">
            <div class="p-6 space-y-4">
                <div class="skeleton aspect-square"></div>
                <div class="skeleton h-6 w-2/3"></div>
                <div class="skeleton h-4 w-1/3"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
